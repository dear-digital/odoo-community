name: Sync 19.0 from upstream

on:
  schedule:
    # Daily. Deliberately not on the hour: GitHub's scheduler is congested at :00
    # and jobs can be delayed or dropped.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      method:
        description: 'api = server-side, seconds, no transfer. git = fallback, clones ~1.3 GB.'
        type: choice
        options: [api, git]
        default: api

permissions:
  contents: write

concurrency:
  group: mirror-sync
  cancel-in-progress: false

env:
  BRANCH: '19.0'
  UPSTREAM_REPO: odoo/odoo
  UPSTREAM_OWNER: odoo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # -----------------------------------------------------------------------
      # Fast path. A fork and its parent share an object store on GitHub, so the
      # commits already exist server-side - nothing has to travel through this
      # runner. This is what the "Sync fork" button does.
      # -----------------------------------------------------------------------
      - name: Sync server-side via the GitHub API
        if: ${{ (github.event.inputs.method || 'api') == 'api' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OURS="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          THEIRS="$(GH_TOKEN="${UPSTREAM_READ_TOKEN}" \
                    gh api "repos/${UPSTREAM_REPO}/git/ref/heads/${BRANCH}" --jq .object.sha)"

          echo "mirror   : ${OURS}"
          echo "upstream : ${THEIRS}"

          if [ "${OURS}" = "${THEIRS}" ]; then
            echo "Already up to date."
            exit 0
          fi

          # Refuse anything that is not a clean fast-forward. "behind" means our
          # tip is an ancestor of theirs, which is the only case we accept.
          STATUS="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${BRANCH}...${UPSTREAM_OWNER}:${BRANCH}" \
            --jq .status)"
          echo "compare  : ${STATUS}"

          case "${STATUS}" in
            behind)    ;;
            identical) echo "Already up to date."; exit 0 ;;
            *)
              echo "::error::Mirror is '${STATUS}' relative to upstream, not 'behind'."
              echo "::error::Either someone committed to ${BRANCH}, or upstream rewrote"
              echo "::error::history. Refusing to sync - investigate before acting."
              exit 1
              ;;
          esac

          MERGE_TYPE="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch="${BRANCH}" --jq .merge_type)"
          echo "merge    : ${MERGE_TYPE}"

          if [ "${MERGE_TYPE}" != "fast-forward" ]; then
            echo "::error::Expected a fast-forward, got '${MERGE_TYPE}'."
            echo "::error::A merge commit on ${BRANCH} breaks the mirror. Investigate."
            exit 1
          fi

          AFTER="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          echo "mirror is now: ${AFTER}"
          if [ "${AFTER}" != "${THEIRS}" ]; then
            echo "::warning::Upstream moved again mid-sync. The next run will catch up."
          fi
          echo "Done."

      # -----------------------------------------------------------------------
      # Fallback. Only runs when dispatched with method=git. Clones the whole
      # branch history (~1.3 GB, a few minutes) and pushes a fast-forward.
      # Keep it: if the API path ever breaks, this is the known-good route.
      # -----------------------------------------------------------------------
      - name: Sync via git (fallback)
        if: ${{ github.event.inputs.method == 'git' }}
        run: |
          set -euo pipefail

          git clone --bare --single-branch --branch "${BRANCH}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            mirror
          cd mirror

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          # --no-tags: never let a tag fetch prune or move our deployed/* tags.
          git fetch --no-tags upstream "${BRANCH}"

          BEFORE="$(git rev-parse "refs/heads/${BRANCH}")"
          AFTER="$(git rev-parse FETCH_HEAD)"
          echo "mirror   : ${BEFORE}"
          echo "upstream : ${AFTER}"

          if [ "${BEFORE}" = "${AFTER}" ]; then
            echo "Already up to date."
            exit 0
          fi

          if ! git merge-base --is-ancestor "${BEFORE}" "${AFTER}"; then
            echo "::error::Upstream ${BRANCH} is not a descendant of the mirror's ${BRANCH}."
            echo "::error::Refusing to push. Investigate before doing anything by hand."
            exit 1
          fi

          echo "Fast-forwarding: $(git rev-list --count "${BEFORE}..${AFTER}") new commits"
          git push origin "FETCH_HEAD:refs/heads/${BRANCH}"
          echo "Done."
